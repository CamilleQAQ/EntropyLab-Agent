[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropylab-agent-v2"
version = "0.1.0.dev0"
description = "Clean-room fault-diagnosis Agent renovation"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT AND BSD-3-Clause AND CC-BY-4.0"
license-files = [
    "LICENSE",
    "LICENSES/*",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
]

[project.optional-dependencies]
ml = ["scikit-learn", "joblib"]
torch = ["torch>=2.14"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "data",
    "results",
    "mlruns",
]
